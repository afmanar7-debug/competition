<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاكي انتقال الإلكترون بين الصوديوم والكلور</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#172033;--muted:#64748b;--line:#94a3b8;--accent:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:24px}
h1{text-align:center;font-size:25px;margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
.card{background:var(--card);border:1px solid #d9e0e8;border-radius:20px;padding:18px;text-align:center}
.title{font-size:21px;font-weight:800}.meta{font-size:14px;margin-top:6px;color:#475569}
.stage{height:340px;display:flex;align-items:center;justify-content:center}
.atom{position:relative;border-radius:50%;transition:width .75s ease,height .75s ease}
.na{width:286px;height:286px}.cl{width:218px;height:218px}
.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid var(--line);border-radius:50%;transition:.75s}
.o3{width:100%;height:100%}.o2{width:70%;height:70%}.o1{width:40%;height:40%}
.count{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#172033;color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;z-index:10}
.nucleus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid #172033;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8}
.nucleus b{font-size:18px}.nucleus small{font-size:9px;font-weight:bold}
.state{font-size:20px;font-weight:900}
.measure{margin-top:10px;border:1px solid #d9e0e8;border-radius:11px;padding:10px;display:flex;justify-content:space-between;gap:12px}
.controls{display:flex;flex-direction:column;gap:10px}
button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:bold;cursor:pointer;min-width:145px}
.primary{background:var(--accent);color:white}.secondary{background:white;border:1px solid #cbd5e1;color:#172033}
button:disabled{opacity:.5;cursor:default}
.result{margin-top:18px;background:#fff;border:1px solid #d9e0e8;border-radius:14px;padding:15px;text-align:center;font-size:17px}
.ionic #naModel{width:190px;height:190px}.ionic #naModel .o3{opacity:0}.ionic #naModel .o2{width:100%;height:100%}.ionic #naModel .o1{width:58%;height:58%}.ionic #clModel{width:280px;height:280px}
@media(max-width:760px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.controls{flex-direction:row;justify-content:center;flex-wrap:wrap}.stage{height:320px}h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){.atom,.orbit{transition:none}}
</style>
</head>
<body>
<main id="sim" class="wrap">
<h1>محاكي انتقال الإلكترون بين الصوديوم والكلور</h1>
<div class="grid">
<section class="card">
<div class="title">الصوديوم Na</div>
<div id="naMeta" class="meta">11 بروتون • 11 إلكترون • 3 مستويات رئيسة</div>
<div class="stage"><div id="naModel" class="atom na">
<div class="orbit o3"><span id="na3" class="count">1</span></div>
<div class="orbit o2"><span class="count">8</span></div>
<div class="orbit o1"><span class="count">2</span></div>
<div class="nucleus"><b>Na</b><small>11 p⁺</small></div>
</div></div>
<div id="naState" class="state">Na</div>
<div id="naRadius" class="measure"><span>نصف القطر</span><strong>186 pm</strong></div>
</section>

<div class="controls">
<button id="go" class="primary">انقل الإلكترون ←</button>
<button id="reset" class="secondary">إعادة</button>
</div>

<section class="card">
<div class="title">الكلور Cl</div>
<div id="clMeta" class="meta">17 بروتون • 17 إلكترون • 3 مستويات رئيسة</div>
<div class="stage"><div id="clModel" class="atom cl">
<div class="orbit o3"><span id="cl3" class="count">7</span></div>
<div class="orbit o2"><span class="count">8</span></div>
<div class="orbit o1"><span class="count">2</span></div>
<div class="nucleus"><b>Cl</b><small>17 p⁺</small></div>
</div></div>
<div id="clState" class="state">Cl</div>
<div id="clRadius" class="measure"><span>نصف القطر</span><strong>99 pm</strong></div>
</section>
</div>
<div id="result" class="result"><strong>Na: 2 ، 8 ، 1</strong> &nbsp; | &nbsp; <strong>Cl: 2 ، 8 ، 7</strong></div>
</main>
<script>
const sim=document.getElementById('sim'),go=document.getElementById('go');
go.addEventListener('click',()=>{
 sim.classList.add('ionic');
 document.getElementById('na3').style.display='none';
 document.getElementById('cl3').textContent='8';
 document.getElementById('naMeta').textContent='11 بروتون • 10 إلكترونات • مستويان رئيسان';
 document.getElementById('clMeta').textContent='17 بروتون • 18 إلكترونًا • 3 مستويات رئيسة';
 document.getElementById('naState').textContent='Na⁺';
 document.getElementById('clState').textContent='Cl⁻';
 document.getElementById('naRadius').innerHTML='<span>نصف القطر</span><strong>102 pm</strong>';
 document.getElementById('clRadius').innerHTML='<span>نصف القطر</span><strong>181 pm</strong>';
 document.getElementById('result').innerHTML='<strong>Na⁺: 2 ، 8</strong> &nbsp; | &nbsp; <strong>Cl⁻: 2 ، 8 ، 8</strong>';
 go.disabled=true;
});
document.getElementById('reset').addEventListener('click',()=>{
 sim.classList.remove('ionic');
 document.getElementById('na3').style.display='flex';
 document.getElementById('na3').textContent='1';
 document.getElementById('cl3').textContent='7';
 document.getElementById('naMeta').textContent='11 بروتون • 11 إلكترون • 3 مستويات رئيسة';
 document.getElementById('clMeta').textContent='17 بروتون • 17 إلكترون • 3 مستويات رئيسة';
 document.getElementById('naState').textContent='Na';
 document.getElementById('clState').textContent='Cl';
 document.getElementById('naRadius').innerHTML='<span>نصف القطر</span><strong>186 pm</strong>';
 document.getElementById('clRadius').innerHTML='<span>نصف القطر</span><strong>99 pm</strong>';
 document.getElementById('result').innerHTML='<strong>Na: 2 ، 8 ، 1</strong> &nbsp; | &nbsp; <strong>Cl: 2 ، 8 ، 7</strong>';
 go.disabled=false;
});
</script>
</body>
</html>
